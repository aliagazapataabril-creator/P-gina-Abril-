<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab jQuery</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <h1>Lab jQuery - Prueba</h1>
  <button id="btnDetalles">Ver Detalles del Servicio</button>
  <p id="detalles" style="display:none">¡jQuery funciona!</p>

  <script>
    $("#btnDetalles").click(function () {
      $("#detalles").slideToggle();
    });
  </script>
</body>
</html>
